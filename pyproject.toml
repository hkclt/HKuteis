[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "HKuteis"
version = "1.0.0"
description = "Um pacote com várias utilidades de Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["Uteis*"]